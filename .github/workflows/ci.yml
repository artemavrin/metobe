name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/setup@v1 requires pnpm 11; the repo pins pnpm 10 via packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The real installer from this checkout; METOBE_BUILD tests this commit instead of a published image.
      # Fed through stdin like `curl | bash`, so nothing may read the rest of the script.
      - run: bash < install.sh | tee /tmp/install.log && grep -q '/claim?token=' /tmp/install.log
        working-directory: scripts
        env:
          METOBE_YES: "1"
          METOBE_BUILD: "1"
      # The one-time claim link from the installer's output: admin tests sign in with it (and so check it works).
      - run: echo "E2E_CLAIM_TOKEN=$(grep -oE 'claim\?token=[A-Za-z0-9_-]+' /tmp/install.log | head -1 | cut -d= -f2)" >> "$GITHUB_ENV"
      - run: pnpm --filter @metobe/web exec playwright install --with-deps chromium
      - run: pnpm --filter @metobe/web test:e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  # Keeps a "Release vX.Y.Z" PR up to date from conventional commits. Merging it creates a draft release;
  # the jobs below attach the image and installer, then publish it. docs/chore commits never release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      minor: ${{ steps.rp.outputs.major }}.${{ steps.rp.outputs.minor }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5

  # Each platform builds on its own native runner; images are pushed by digest and merged below.
  image:
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge platforms into versioned tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:${{ needs.release.outputs.minor }}" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Attach installer and compose file
        run: |
          mkdir -p /tmp/assets
          sed "s/^METOBE_VERSION=\"\"/METOBE_VERSION=\"$VERSION\"/" scripts/install.sh > /tmp/assets/install.sh
          grep -q "^METOBE_VERSION=\"$VERSION\"" /tmp/assets/install.sh
          cp compose.yml /tmp/assets/compose.yml
          gh release upload "$TAG" /tmp/assets/install.sh /tmp/assets/compose.yml --clobber
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
