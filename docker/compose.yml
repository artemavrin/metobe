name: purr

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: purr:local
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment: &app-env
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://${POSTGRES_USER:-purr}:${POSTGRES_PASSWORD:-purr}@postgres:5432/${POSTGRES_DB:-purr}}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: purr:local
    command: ["worker"]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment: *app-env
    depends_on:
      app:
        condition: service_healthy

  # Bundled database; skipped when install.sh points APP_DATABASE_URL at an external one.
  postgres:
    image: postgres:18-alpine
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purr}
      POSTGRES_USER: ${POSTGRES_USER:-purr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purr}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  redis:
