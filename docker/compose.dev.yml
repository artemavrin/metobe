# Local development on top of compose.yml: host ports for the databases, SearXNG and Mailpit.
# Used via COMPOSE_FILE in the dev .env; installations use compose.yml alone.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  # The app runs on the host in development: SEARXNG_URL=http://localhost:8888 in the dev .env.
  searxng:
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
