name: metobe

services:
  app:
    # Published release image; docker/compose.build.yml adds a source build for development and CI.
    image: ${METOBE_IMAGE:-ghcr.io/artemavrin/metobe:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: &app-env
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://${POSTGRES_USER:-metobe}:${POSTGRES_PASSWORD:-metobe}@postgres:5432/${POSTGRES_DB:-metobe}}
      REDIS_URL: redis://redis:6379
      # The chat's web search (ARCH §8.1); without it the chat simply has no web.
      SEARXNG_URL: http://searxng:8080
      # Data protection (docs/PII-GUARD-PLAN.md): the switch in its settings has the updater start `pii-guard`, and the
      # app then finds it on its own; install.sh with METOBE_PII=1 sets this for an install without the updater.
      # Unset and not started, calls go to models as they are.
      PII_GUARD_URL: ${PII_GUARD_URL:-}
      PII_GUARD_TOKEN: ${PII_GUARD_API_TOKEN:-}
    volumes:
      # Admin downloads are served by the app; the updater is the only writer to the shared backup volume.
      - backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      s3:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # The web server starts after `metobe migrate`: an update over several releases may migrate for minutes, and
      # checks failing meanwhile must not call the app unhealthy (and roll the update back). It turns healthy at its
      # first good answer, so a quick start waits for nothing.
      start_period: 10m

  worker:
    image: ${METOBE_IMAGE:-ghcr.io/artemavrin/metobe:latest}
    command: ["worker"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      app:
        condition: service_healthy

  # Updates from the app (D35), when install.sh turned it on: the one service with docker.sock — root on the host, so it
  # takes no connections; the app asks it through Redis. It sees the installation's folder at the host's own path
  # (METOBE_DIR), so compose run from inside resolves it the same, and keeps three copies of the base in `backups`.
  updater:
    image: ${METOBE_UPDATER_IMAGE:-${METOBE_IMAGE:-ghcr.io/artemavrin/metobe:latest}}
    command: ["updater"]
    profiles: ["updater"]
    user: "0:0"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      METOBE_DIR: ${METOBE_DIR:-/opt/metobe}
    working_dir: ${METOBE_DIR:-/opt/metobe}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${METOBE_DIR:-/opt/metobe}:${METOBE_DIR:-/opt/metobe}
      - backups:/backups
    depends_on:
      redis:
        condition: service_healthy

  # Bundled database; skipped when install.sh points APP_DATABASE_URL at an external one.
  postgres:
    image: postgres:18-alpine
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metobe}
      POSTGRES_USER: ${POSTGRES_USER:-metobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metobe}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bundled file storage (D4, spike S6): SeaweedFS `weed mini` — master, volume, filer and S3 in one process, the bucket
  # made at start. Inside the network only: the browser reaches files through the app. Skipped when install.sh points
  # S3_* at an S3 of your own. It refuses to start without a secret — `weed mini` without keys would serve anyone.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: ["s3"]
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - '[ -n "$$AWS_SECRET_ACCESS_KEY" ] || { echo "S3_SECRET_KEY is not set" >&2; exit 1; }; exec /entrypoint.sh mini -dir=/data -admin.ui=false'
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-metobe}
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Data protection: our PII Guard fork masks personal data before a call to an external model
  # (docs/PII-GUARD-PLAN.md). Inside network only; the NER model is in the image (about 3 GB), so it runs offline and
  # only with the `pii` profile on. Until it has loaded, the app refuses external calls (fail closed).
  pii-guard:
    # Pinned by commit, not by the model's tag (ru-s34 moves with each build): a server that has the image takes a new
    # one only under a new name. The updater recreates the service after an update, so it pulls this one.
    image: ${PII_GUARD_IMAGE:-ghcr.io/artemavrin/pii-guard:sha-e962855}
    profiles: ["pii"]
    restart: unless-stopped
    environment:
      # install.sh and the updater write both, an older install's too; the key derives the labels, the token is what
      # the app sends. Without the key the service refuses to mask, and the app does not send.
      PII_GUARD_TENANT_KEY: ${PII_GUARD_TENANT_KEY:-}
      PII_GUARD_API_TOKEN: ${PII_GUARD_API_TOKEN:-}
      # The app calls it by this name; otherwise it answers only to localhost and refuses the app with 400.
      PII_GUARD_ALLOWED_HOSTS: pii-guard
    mem_limit: 3g

  # Web search: SearXNG on the inside network only (no port out), JSON on, the load spread over several engines and
  # a refusing engine rested for minutes, not a day — they ban an IP that asks too often (spike S8, D21).
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    restart: unless-stopped
    environment:
      # install.sh writes one; SearXNG refuses to start with its default. Not exposed, so the fallback only signs its
      # own preference cookies.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-metobe-searxng-inside-only}
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml

configs:
  searxng-settings:
    content: |
      use_default_settings: true
      server:
        limiter: false
        public_instance: false
        image_proxy: false
      search:
        formats: [html, json]
        safe_search: 0
        suspended_times:
          SearxEngineAccessDenied: 300
          SearxEngineCaptcha: 600
          SearxEngineTooManyRequests: 120
          cf_SearxEngineCaptcha: 600
          cf_SearxEngineAccessDenied: 300
          recaptcha_SearxEngineCaptcha: 600
      outgoing:
        request_timeout: 3.0
        max_request_timeout: 8.0
      engines:
        - name: google
          disabled: false
        - name: yahoo
          disabled: false

volumes:
  postgres:
  redis:
  s3:
  backups:
